x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.airflow
  image: rakuten-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-dev-airflow-secret}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    RAKUTEN_API_URL: http://api:8000
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags
    - ./services/airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: rakuten-api:latest
    container_name: rakuten-api
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_JWT_SECRET: ${API_JWT_SECRET:-dev-secret-change-me}
      API_ACCESS_TOKEN_EXPIRE_MINUTES: ${API_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:-admin}
      API_STUB_MODE: ${API_STUB_MODE:-true}
      API_MODEL_PATH: /app/core/artifacts/model.keras
      API_SCALER_PATH: /app/core/models/artifacts/scaler.joblib
      API_PCA_PATH: /app/core/models/artifacts/pca.joblib
      API_LABELS_MAP_PATH: /app/core/artifacts/labels_map.json
      API_METRICS_PATH: /app/core/artifacts/metrics.json
      API_TRAIN_COMMAND: python -m core.src.models.train
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./core/artifacts:/app/core/artifacts
      - ./core/data:/app/core/data
      - ./core/models/artifacts:/app/core/models/artifacts
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.streamlit
    image: rakuten-streamlit:latest
    container_name: rakuten-streamlit
    env_file:
      - path: .env
        required: false
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      UI_API_URL: http://api:8000
      UI_MLFLOW_URL: http://mlflow:5000
      UI_AIRFLOW_URL: http://airflow-webserver:8080
      UI_AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      UI_AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      UI_DEFAULT_USERNAME: ${API_ADMIN_USERNAME:-admin}
      UI_ARTIFACTS_DIR: /app/core/artifacts
      UI_PARAMS_FILE: /app/core/params.yaml
      UI_MLRUNS_DIR: /app/tracking/mlflow/mlruns
    volumes:
      # Read-only: the front-end never writes into the pipeline artifacts.
      - ./core/artifacts:/app/core/artifacts:ro
    # service_started, not service_healthy: if the API fails to come up, the
    # interface must still start and say so rather than stay invisible.
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mlflow
    image: rakuten-mlflow:latest
    container_name: rakuten-mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_backend:/mlflow/mlruns
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16-alpine
    container_name: rakuten-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: rakuten-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname "$${AIRFLOW_ADMIN_FIRSTNAME:-Admin}" \
          --lastname "$${AIRFLOW_ADMIN_LASTNAME:-User}" \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: rakuten-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: rakuten-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  airflow_logs:
  airflow_postgres:
  mlflow_artifacts:
  mlflow_backend:
